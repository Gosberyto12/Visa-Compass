name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx supabase@latest start
      - run: npx supabase@latest db reset
      - run: npx supabase@latest test db
      - if: always()
        run: npx supabase@latest stop --no-backup
      - run: npm run build
